name: Sync Debts Data to JSON

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      tenant_schema:
        description: 'اسم الشركة أو السكيمّا (مثال: company1)'
        required: false
        default: ''
      user_id:
        description: 'ID المستخدم (إذا لم يرسل اسم الشركة)'
        required: false
        default: ''

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and Process Data
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          async function run() {
            const API_URL = "https://nawh-ai25.vercel.app/api/get";
            const inputSchema = "${{ github.event.inputs.tenant_schema }}";
            const inputUserId = "${{ github.event.inputs.user_id }}";

            // إنشاء مجلد data حتماً لتجنب خطأ Git
            const outputDir = path.join(process.cwd(), "data");
            if (!fs.existsSync(outputDir)) {
              fs.mkdirSync(outputDir, { recursive: true });
            }
            // إنشاء ملف .gitkeep داخل المجلد لضمان وجود المسار في git
            fs.writeFileSync(path.join(outputDir, ".gitkeep"), "", "utf8");

            const headers = {
              "Accept": "application/json",
              "Content-Type": "application/json"
            };

            if (inputSchema) headers["x-tenant-schema"] = inputSchema;
            if (inputUserId) headers["user-id"] = inputUserId;

            console.log("Fetching data from:", API_URL);
            
            const response = await fetch(API_URL, {
              method: "POST",
              headers: headers,
              body: JSON.stringify({
                companyName: inputSchema || undefined,
                userId: inputUserId || undefined
              })
            });

            const rawText = await response.text();

            if (!response.ok) {
              console.error(`HTTP Error: ${response.status} ${response.statusText}`);
              console.error("Response body:", rawText);
              process.exit(1);
            }

            let result;
            try {
              result = JSON.parse(rawText);
            } catch (err) {
              console.error("Failed to parse response as JSON:", rawText);
              process.exit(1);
            }

            console.log("API Response Summary:", {
              success: result.success,
              schemaUsed: result.schemaUsed,
              debtsCount: result.debts ? result.debts.length : 0,
              message: result.message || "OK"
            });

            if (!result.success || !result.debts || result.debts.length === 0) {
              console.log("⚠️ لم يتم العثور على أي ديون في السكيمّا (" + (result.schemaUsed || "public") + ").");
              return;
            }

            const company = result.schemaUsed || "default_company";

            // تجميع البيانات بحسب العميل
            const grouped = {};
            for (const item of result.debts) {
              const client = item.personName || "unknown_client";
              if (!grouped[client]) grouped[client] = [];
              grouped[client].push(item);
            }

            // كتابة الملفات باسم الشركة والعميل
            let savedFilesCount = 0;
            for (const [clientName, records] of Object.entries(grouped)) {
              const safeCompany = company.replace(/[^a-zA-Z0-9_\u0600-\u06FF]/g, "_");
              const safeClient = clientName.replace(/[^a-zA-Z0-9_\u0600-\u06FF]/g, "_");
              
              const fileName = `${safeCompany}_${safeClient}.json`;
              const filePath = path.join(outputDir, fileName);

              const fileData = {
                company: company,
                client: clientName,
                updatedAt: new Date().toISOString(),
                recordsCount: records.length,
                debts: records
              };

              fs.writeFileSync(filePath, JSON.stringify(fileData, null, 2), "utf8");
              console.log(`✅ Saved file: ${fileName} (${records.length} records)`);
              savedFilesCount++;
            }

            console.log(`\n🎉 Total created/updated files: ${savedFilesCount}`);
          }

          run().catch(err => { 
            console.error("Execution error:", err); 
            process.exit(1); 
          });
          '

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto-sync: update debts JSON files" && git push)
