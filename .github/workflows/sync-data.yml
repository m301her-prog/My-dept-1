name: Sync Debts Data to JSON

on:
  schedule:
    # يعمل تلقائياً كل 6 ساعات
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Data from action.js and Create JSON Files
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          async function run() {
            const API_URL = "https://nawh-ai25.vercel.app/api/action";
            
            console.log("Fetching data from:", API_URL);

            const response = await fetch(API_URL);
            const rawText = await response.text();

            if (!response.ok) {
              console.error(`HTTP Error: ${response.status} ${response.statusText}`);
              console.error("Response:", rawText);
              process.exit(1);
            }

            let result;
            try {
              result = JSON.parse(rawText);
            } catch (err) {
              console.error("Failed to parse JSON response:", rawText);
              process.exit(1);
            }

            console.log(`API Returned: ${result.totalRecords || 0} total debt records.`);

            if (!result.success || !result.debts || result.debts.length === 0) {
              console.log("⚠️ لم يتم العثور على أية ديون في قاعدة البيانات.");
              return;
            }

            const outputDir = path.join(process.cwd(), "data");
            if (!fs.existsSync(outputDir)) {
              fs.mkdirSync(outputDir, { recursive: true });
            }

            // تجميع الديون بحسب الشركة والعميل
            const grouped = {};
            for (const item of result.debts) {
              const company = item.companyName || "default_company";
              const client = item.personName || "unknown_client";
              const key = `${company}___${client}`;

              if (!grouped[key]) {
                grouped[key] = { company, client, records: [] };
              }
              grouped[key].records.push(item);
            }

            let savedFilesCount = 0;

            // إنشاء ملف JSON لكل عميل داخل كل شركة
            for (const entry of Object.values(grouped)) {
              const safeCompany = entry.company.replace(/[^a-zA-Z0-9_\u0600-\u06FF]/g, "_");
              const safeClient = entry.client.replace(/[^a-zA-Z0-9_\u0600-\u06FF]/g, "_");

              const fileName = `${safeCompany}_${safeClient}.json`;
              const filePath = path.join(outputDir, fileName);

              const filePayload = {
                company: entry.company,
                client: entry.client,
                updatedAt: new Date().toISOString(),
                recordsCount: entry.records.length,
                debts: entry.records
              };

              fs.writeFileSync(filePath, JSON.stringify(filePayload, null, 2), "utf8");
              console.log(`✅ Saved file: ${fileName} (${entry.records.length} records)`);
              savedFilesCount++;
            }

            console.log(`\n🎉 Total created/updated files: ${savedFilesCount}`);
          }

          run().catch(err => { 
            console.error("Execution error:", err); 
            process.exit(1); 
          });
          '

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto-sync: update debts JSON files via action.js" && git push)
